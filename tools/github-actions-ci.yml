name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (python ${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run engine tests
        run: python -m pytest tests -q

      - name: Build every example deck
        run: python tools/bench.py

      - name: Validate exported decks
        run: |
          python tools/check_deck.py examples/aurora-launch.pptx
          python tools/check_deck.py examples/annual-review.pptx
          python tools/check_deck.py examples/editorial-keynote.pptx
          python tools/check_deck.py examples/ai-thinking-orchestration.pptx

  strict:
    name: strict checks (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Contrast / bleed / raster checks must be clean
        run: |
          python tools/check_deck.py examples/aurora-launch.pptx --strict
          python tools/check_deck.py examples/annual-review.pptx --strict
          python tools/check_deck.py examples/editorial-keynote.pptx --strict
          python tools/check_deck.py examples/ai-thinking-orchestration.pptx --strict

      - name: Editability check
        run: |
          python tools/verify_editability.py examples/ai-thinking-orchestration.pptx --source examples/ai-thinking-orchestration.html
